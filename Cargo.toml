[package]
name = "nash"
version = "0.3.0"
edition = "2021"
description = "nash - a modern sh-compatible shell with the best of bash and zsh, plus its own ideas"
license = "MIT"
readme = "README.md"

[dependencies]
libc = "0.2"
rustix = { version = "0.38", default-features = false, features = [
    "fs",
    "pipe",
    "process",
    "stdio",
    "termios",
    "time",
    "mm",
] }

[profile.release]
lto = true
strip = true
