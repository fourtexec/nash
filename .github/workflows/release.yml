name: release

# Builds nash and nashed for every supported platform and publishes the binaries
# as a release:
#   - every push to main is a development build tagged dev1, dev2, dev3, ...
#     and marked as a pre-release
#   - pushing a tag v1.2.3 is the stable release 1.2.3
# Every release carries the same files (nash-<os>-<cpu>, nashed-<os>-<cpu>, and
# SHA256SUMS), and `nashed install` / `nashed update` / `nashed update self`
# download the binary for their platform straight from the release.
# After a release the `site` job updates the nash page of fourtexec.site.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two pushes cannot pick the same dev number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The name of the release, known before the build so that the binaries
  # can report it (`nash --version`). Empty: a build that is not released.
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute release tag
        id: tag
        run: |
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
              *)
                # Publish v1.0.1 on the next push to main if it does not exist yet,
                # then continue publishing devN pre-releases as before.
                has_v101=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/v1.0.1')
                if [ -z "$has_v101" ]; then
                  tag="v1.0.1"
                else
                  # one higher than the newest devN tag; dev1 if there is none yet
                  last=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/dev*' | sed -n 's|.*refs/tags/dev\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)
                  tag="dev$(( ${last:-0} + 1 ))"
                fi
                ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: name
    env:
      NASH_RELEASE: ${{ needs.name.outputs.tag }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, suffix: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, suffix: linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, suffix: macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build nash and nashed
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Rename the binaries
        run: |
          cp target/${{ matrix.target }}/release/nash nash-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/nashed nashed-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: nash-${{ matrix.suffix }}
          path: |
            nash-${{ matrix.suffix }}
            nashed-${{ matrix.suffix }}

  build-android-termux:
    name: Build Android (Termux, aarch64, latest NDK)
    needs: name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - name: Build release binaries
        env:
          NASH_RELEASE: ${{ needs.name.outputs.tag }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build --release --locked --workspace --target aarch64-linux-android
      - name: Rename the binaries
        run: |
          cp target/aarch64-linux-android/release/nash nash-android-aarch64
          cp target/aarch64-linux-android/release/nashed nashed-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: nash-android-aarch64
          path: |
            nash-android-aarch64
            nashed-android-aarch64

  release:
    needs: [name, build, build-android-termux]
    if: needs.name.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.name.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        env:
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          sha256sum nash-* nashed-* > SHA256SUMS
          cat SHA256SUMS
          # The first builds of nash update themselves by reading the file
          # VERSION of the latest release: give stable releases one, so
          # that they can move on to a build with the current updater.
          case "$TAG" in v*) echo "${TAG#v}" > VERSION ;; esac
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          # A development build is a pre-release, so that GitHub's "latest
          # release" (and with it `nashed install` / `nashed update`) is always a stable one.
          case "$TAG" in
            dev*) kind="--prerelease --latest=false" ;;
            *) kind="" ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a release made by hand for this tag: add the binaries to it
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            case "$TAG" in dev*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease ;; esac
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "nash $TAG" --generate-notes $kind
          fi
      - name: Mark older development builds as pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the builds published before development builds were pre-releases
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-pre-releases --json tagName --jq '.[].tagName' |
            grep -E '^dev[0-9]+$' |
            while read -r tag; do
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease
            done || true

  # Bring fourtexec.site up to date with the release: the project page with
  # the newest releases and changes (projects/nash.md) and the list of
  # releases (nash/manifest.json). Both are written by the generator of the
  # site repository.
  #
  # Needs the SITE_TOKEN secret: a fine-grained token with "Contents: read
  # and write" on fourtexec/fourtexec.github.io. Without it this job does
  # nothing and the site catches up by itself within half an hour.
  site:
    needs: release
    runs-on: ubuntu-latest
    # the site's generator only reads the releases of this repository
    permissions:
      contents: read
    # one push to the site at a time, whatever branch or tag started it
    concurrency:
      group: nash-site
      cancel-in-progress: false
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      - name: Is there a token for the site?
        id: token
        run: |
          if [ -n "$SITE_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SITE_TOKEN is not set: fourtexec.site will pick this release up by itself"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'yes'
        with:
          repository: fourtexec/fourtexec.github.io
          ref: ghpages
          token: ${{ secrets.SITE_TOKEN }}
      - name: Regenerate the manifest and the project page
        if: steps.token.outputs.present == 'yes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/test_nash_manifest.py
          mkdir -p nash projects
          python3 .github/scripts/nash-manifest.py nash/manifest.json projects/nash.md
      - name: Push to fourtexec.site
        if: steps.token.outputs.present == 'yes'
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git add nash/manifest.json projects/nash.md
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "nash $TAG"
          # Workflows of the site commit to the same branch.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
