name: release

# Builds nash for every supported platform and publishes the binaries as a
# release:
#   - every push to main is a development build tagged dev1, dev2, dev3, ...
#   - pushing a tag v1.2.3 is the stable release 1.2.3
# The manifest on https://fourtexec.site/nash/manifest.json is regenerated
# from the releases by a workflow of fourtexec/fourtexec.github.io, and
# `nash update`, `nash update dev` and `nash update VERSION` install from it.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two pushes cannot pick the same dev number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The name of the release, known before the build so that the binaries
  # can report it (`nash --version`). Empty: a build that is not released.
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute release tag
        id: tag
        run: |
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
              *)
                # one higher than the newest devN tag; dev1 if there is none yet
                last=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/dev*' | sed -n 's|.*refs/tags/dev\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)
                tag="dev$(( ${last:-0} + 1 ))"
                ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: name
    env:
      NASH_RELEASE: ${{ needs.name.outputs.tag }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: nash-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: nash-linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: nash-macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: nash-macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename the binary
        run: cp target/${{ matrix.target }}/release/nash ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-android-termux:
    name: Build Android (Termux, aarch64, latest NDK)
    needs: name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - name: Build release binary
        env:
          NASH_RELEASE: ${{ needs.name.outputs.tag }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build --release --locked --target aarch64-linux-android
      - name: Rename the binary
        run: cp target/aarch64-linux-android/release/nash nash-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: nash-android-aarch64
          path: nash-android-aarch64

  release:
    needs: [name, build, build-android-termux]
    if: needs.name.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum nash-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a release made by hand for this tag: add the binaries to it
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "nash $TAG" --generate-notes
          fi
      # Without the secret the site still picks the release up by itself,
      # within half an hour. SITE_DISPATCH_TOKEN: a fine-grained token with
      # "Contents: read and write" on fourtexec/fourtexec.github.io.
      - name: Tell fourtexec.site to regenerate the manifest
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        if: env.GH_TOKEN != ''
        run: gh api repos/fourtexec/fourtexec.github.io/dispatches -f event_type=nash-release
