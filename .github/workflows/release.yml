name: release

# Every push to main builds nash for every supported platform and publishes
# the binaries as a release tagged dev1, dev2, dev3, ... Users download the
# binary for their platform and install it with `nash update PATH`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two pushes cannot pick the same dev number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: nash-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: nash-linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: nash-macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: nash-macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename the binary
        run: cp target/${{ matrix.target }}/release/nash ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-android-termux:
    name: Build Android (Termux, aarch64, latest NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - name: Build release binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build --release --locked --target aarch64-linux-android
      - name: Rename the binary
        run: cp target/aarch64-linux-android/release/nash nash-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: nash-android-aarch64
          path: nash-android-aarch64

  release:
    needs: [build, build-android-termux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute release tag
        id: tag
        run: |
          # one higher than the newest devN tag; dev1 if there is none yet
          last=$(git ls-remote --tags origin 'refs/tags/dev*' | sed -n 's|.*refs/tags/dev\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)
          echo "tag=dev$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum nash-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "nash $tag" --generate-notes
